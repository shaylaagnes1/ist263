<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="styless.css">
  <link rel="icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&family=Big+Shoulders+Inline:opsz,wght@10..72,100..900&display=swap" rel="stylesheet">
</head>

<body>
  <div class="wix-container">
    <img src="websitepics/wixlogo.png" alt="Wix logo" class="wix-logo">
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="skills.html">Gallery</a>
    <a href="aboutme.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section class="contact-section">
    <div class="form-wrapper">
      <h1>Let's Talk!</h1>

      <form class="contact-form" action="https://formspree.io/f/mandgvoa" method="post">
        <fieldset>
          <legend>Contact Me</legend>

          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required>

          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject">

          <label for="message">Message *</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <div class="form-actions">
            <button type="submit">Send Message</button>
          </div>
        </fieldset>
      </form>
    </div>

    <div class="image-wrapper">
      <img src="websitepics/hair.png" alt="hair" class="hair">
    </div>
  </section>

  <div class="column contact-links">
    <p><a href="mailto:sismael@syr.edu">sismael@syr.edu</a></p>
    <p><a href="https://www.linkedin.com/in/shaylaismael0121">My LinkedIn</a></p>
  </div>

  <footer>
    <p class="copyright">© 2025 Shayla Ismael</p>
  </footer>
</body>
</html>
